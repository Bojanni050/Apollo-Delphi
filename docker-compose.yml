services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
      POSTGRES_DB: apollo
    ports:
      - "5432:5432"
    volumes:
      - apollo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APOLLO_DATABASE_URL: postgresql+psycopg2://apollo:apollo@db:5432/apollo
      # Everything below can also be set in the app (Instellingen); values chosen there win.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-model}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      BACKGROUND_LLM_PROVIDER: ${BACKGROUND_LLM_PROVIDER:-}
      BACKGROUND_LLM_MODEL: ${BACKGROUND_LLM_MODEL:-}
      BACKGROUND_LLM_BASE_URL: ${BACKGROUND_LLM_BASE_URL:-}
      BACKGROUND_LLM_API_KEY: ${BACKGROUND_LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mock-embedder}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_RUNTIME: ${EMBEDDING_RUNTIME:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      # Werkmappen are git repositories: keep them outside the image so they survive rebuilds.
      WORKSPACES_ROOT: /data/workspaces
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - apollo_uploads:/data/uploads
      - apollo_workspaces:/data/workspaces
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  apollo_pgdata:
  apollo_uploads:
  apollo_workspaces:
