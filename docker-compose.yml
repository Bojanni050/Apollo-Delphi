services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
      POSTGRES_DB: apollo
    ports:
      - "5432:5432"
    volumes:
      - apollo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APOLLO_DATABASE_URL: postgresql+psycopg2://apollo:apollo@db:5432/apollo
      # Everything below can also be set in the app (Instellingen); values chosen there win.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-model}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      BACKGROUND_LLM_PROVIDER: ${BACKGROUND_LLM_PROVIDER:-}
      BACKGROUND_LLM_MODEL: ${BACKGROUND_LLM_MODEL:-}
      BACKGROUND_LLM_BASE_URL: ${BACKGROUND_LLM_BASE_URL:-}
      BACKGROUND_LLM_API_KEY: ${BACKGROUND_LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mock-embedder}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_RUNTIME: ${EMBEDDING_RUNTIME:-ollama}
      # Chosen llama.cpp models point here (the llama service below).
      LLAMACPP_BASE_URL: http://llama:8080/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      # Werkmappen are git repositories: keep them outside the image so they survive rebuilds.
      WORKSPACES_ROOT: /data/workspaces
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - apollo_uploads:/data/uploads
      - apollo_workspaces:/data/workspaces
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Optional local embedding server (llama.cpp, MIT licensed): `docker compose --profile llama up -d` or
  # COMPOSE_PROFILES=llama in .env. It serves a GGUF the app downloaded into backend/models (Instellingen >
  # Embeddingmodel > Lokale modellen > llama.cpp > Downloaden), so nothing is installed or downloaded twice.
  # In the app, choose that model (Base URL becomes http://llama:8080/v1), save, test and re-index.
  # It loads ONE model at start: after choosing another GGUF set LLAMA_MODEL_FILE (and LLAMA_POOLING:
  # `last` for the Jina code model, `cls` for bge-m3) and run `up -d llama` again. These GGUFs carry no
  # pooling type, without --pooling the server refuses to return embeddings.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llama"]
    command: >
      -m /models/${LLAMA_MODEL_FILE:-jina-code-embeddings-1.5b-Q8_0.gguf}
      --embeddings --pooling ${LLAMA_POOLING:-last} --host 0.0.0.0 --port 8080
    volumes:
      - ./backend/models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  apollo_pgdata:
  apollo_uploads:
  apollo_workspaces:
